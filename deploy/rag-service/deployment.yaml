apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: default
  labels:
    app: rag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: RC_VERSION
              value: "test"
