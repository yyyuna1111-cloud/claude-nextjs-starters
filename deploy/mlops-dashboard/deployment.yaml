apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-dashboard
  namespace: mlops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-dashboard
  template:
    metadata:
      labels:
        app: mlops-dashboard
    spec:
      containers:
        - name: mlops-dashboard
          image: 10.70.170.227:80/mlops-dashboard:v0.1.4
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mlops-dashboard-env
          volumeMounts:
            - name: sllm-storage
              mountPath: /mnt/sllm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: sllm-storage
          persistentVolumeClaim:
            claimName: shared-sllm
