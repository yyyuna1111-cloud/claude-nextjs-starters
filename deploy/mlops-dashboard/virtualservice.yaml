apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mlops-dashboard
  namespace: mlops-dashboard
spec:
  hosts:
    - mlops-dashboard.local
  gateways:
    - istio-system/shared-gateway
  http:
    - route:
        - destination:
            host: mlops-dashboard.mlops-dashboard.svc.cluster.local
            port:
              number: 3000
