apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: dshub
  namespace: dshub
spec:
  hosts:
    - dshub.local
  gateways:
    - istio-system/shared-gateway
  http:
    - route:
        - destination:
            host: dshub.dshub.svc.cluster.local
            port:
              number: 3000
